  # --- Techniek & standaarden ----------------------------------------------------
  - id: github-arf
    naam: "EUDI Wallet – Architecture and Reference Framework (releases)"
    categorie: techniek
    type: feed
    url: https://github.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework/releases.atom
    titel_prefix: "ARF-release: "
    standaard_onderwerp: eudi
    prioriteit: 1
    site: https://github.com/eu-digital-identity-wallet/eudi-doc-architecture-and-reference-framework
    toelichting: >-
      Nieuwe versies van het Architecture and Reference Framework, het technische
      raamwerk van de Commissie voor EUDI Wallets.

  - id: etsi-nieuws
    naam: "ETSI – nieuws"
    categorie: techniek
    type: feed
    url: https://www.etsi.org/newsroom/feed/
    filter: true
    prioriteit: 2
    site: https://www.etsi.org/newsroom/news
    toelichting: >-
      Europese normalisatie-instelling; ETSI ESI maakt de normen voor
      vertrouwensdiensten en (gekwalificeerde) elektronische aangetekende bezorging.

  # --- Nederlandse overheid ------------------------------------------------------
  - id: digitale-overheid
    naam: "Digitale Overheid (BZK) – nieuws"
    categorie: nl-overheid
    type: feed
    url: https://www.digitaleoverheid.nl/feed/
    filter: true
    prioriteit: 1
    site: https://www.digitaleoverheid.nl/nieuws/
    toelichting: >-
      Nieuws over de Nederlandse digitale overheid, waaronder het EDI-stelsel, de
      NL Wallet, eHerkenning en de Berichtenbox voor bedrijven.

  - id: rijksoverheid-digitale-overheid
    naam: "Rijksoverheid – onderwerp Digitale overheid (nieuws)"
    categorie: nl-overheid
    type: feed
    url: https://feeds.rijksoverheid.nl/onderwerpen/digitale-overheid/nieuws.rss
    filter: true
    prioriteit: 2
    site: https://www.rijksoverheid.nl/onderwerpen/digitale-overheid
    toelichting: Nieuws van de ministeries over de digitale overheid.

  - id: rijksoverheid-digitale-overheid-documenten
    naam: "Rijksoverheid – onderwerp Digitale overheid (documenten)"
    categorie: nl-overheid
    type: feed
    url: https://feeds.rijksoverheid.nl/onderwerpen/digitale-overheid/documenten.rss
    filter: true
    prioriteit: 1
    site: https://www.rijksoverheid.nl/onderwerpen/digitale-overheid/documenten
    toelichting: >-
      Kamerbrieven, rapporten en BNC-fiches, zoals fiche 3 over de Verordening Europese
      Business Wallet.

  - id: tweede-kamer
    naam: "Tweede Kamer – Kamerstukken (open data)"
    categorie: nl-overheid
    type: json
    url: https://gegevensmagazijn.tweedekamer.nl/OData/v4/2.0/Document
    params:
      $filter: >-
        Verwijderd eq false and (contains(Titel,'wallet') or contains(Onderwerp,'wallet')
        or contains(Titel,'Wallet') or contains(Onderwerp,'Wallet')
        or contains(Onderwerp,'eIDAS') or contains(Onderwerp,'MijnOverheid Zakelijk')
        or contains(Onderwerp,'digitale identiteit') or contains(Onderwerp,'portemonnees voor ondernemingen'))
      $orderby: Datum desc
      $top: 40
    items: value
    velden:
      titel: "{Soort}: {Onderwerp}"
      url: "https://www.tweedekamer.nl/downloads/document?id={DocumentNummer}"
      datum: Datum
      samenvatting: Titel
    filter: true
    prioriteit: 1
    site: https://www.tweedekamer.nl/kamerstukken
    toelichting: >-
      Kamerbrieven, verslagen en moties over wallets, eIDAS en MijnOverheid Zakelijk via de
      open-data-API van de Tweede Kamer.

  - id: officiele-bekendmakingen
    naam: "Officiële bekendmakingen – Kamerstukken en Staatscourant"
    categorie: nl-overheid
    type: sru
    url: https://repository.overheid.nl/sru
    query: >-
      c.product-area==officielepublicaties and (cql.textAndIndexes="business wallet"
      or cql.textAndIndexes="EDI-wallet" or cql.textAndIndexes="eIDAS"
      or cql.textAndIndexes="MijnOverheid Zakelijk")
    max: 40
    filter: true
    prioriteit: 2
    site: https://zoek.officielebekendmakingen.nl/
    toelichting: >-
