      Wekelijkse voortgangsupdate van het MOZa-team. Laat zien wat er met wallets gebeurt in
      de MOZa-proeven, bijvoorbeeld de NL Wallet en de Yivi Business Wallet.

  - id: moza-github
    naam: "MijnOverheid Zakelijk – ontwikkeling op GitHub (issues)"
    categorie: nl-moza
    type: json
    url: https://api.github.com/search/issues
    params:
      q: "repo:MinBZK/MijnOverheidZakelijk wallet OR EBW OR EUDI OR eIDAS OR QERDS"
      sort: created
      order: desc
      per_page: 30
    items: items
    velden:
      titel: "MOZa-issue: {title}"
      url: "{html_url}"
      datum: created_at
      samenvatting: body
    filter: false
    standaard_onderwerp: eudi
    prioriteit: 2
    site: https://github.com/MinBZK/MijnOverheidZakelijk
    toelichting: >-
      MOZa wordt open ontwikkeld. Issues over wallets laten zien wat het team
      daadwerkelijk bouwt of onderzoekt, zoals de NL Wallet-integratie in de proef.

  # --- Media (secundair, standaard uit) -------------------------------------------
  - id: biometric-update
    naam: "Biometric Update – digital identity"
    categorie: media
    type: feed
    url: https://www.biometricupdate.com/feed
    filter: true
    prioriteit: 3
    actief: false
