  - id: aptitude
    naam: "APTITUDE – Large Scale Pilot (reizen en betalen)"
    categorie: pilots
    type: feed
    url: https://aptitude.digital-identity-wallet.eu/feed/
    standaard_onderwerp: eudi
    prioriteit: 2
