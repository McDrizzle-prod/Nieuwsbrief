    categorie: nl-overheid
    type: pagewatch
    url: https://www.eerstekamer.nl/eu/edossier/e260004_voorstel_voor_een
    selector: "#main_content, main, #content"
    titel: Eerste Kamer – dossier E260004 European Business Wallets
    standaard_onderwerp: ebw
    prioriteit: 1
    toelichting: >-
      Het Eerste Kamer-dossier over het EBW-voorstel met de Nederlandse stukken, zoals het
      BNC-fiche en de behandeling in de commissie.

  - id: nl-wallet
    naam: "NL Wallet – releases (MinBZK)"
    categorie: nl-overheid
    type: feed
    url: https://github.com/MinBZK/nl-wallet/releases.atom
    titel_prefix: "NL Wallet: "
    standaard_onderwerp: eudi
    prioriteit: 2
    site: https://github.com/MinBZK/nl-wallet
    toelichting: Nieuwe versies van de Nederlandse EUDI-wallet (NL Wallet).

  # --- MijnOverheid Zakelijk -----------------------------------------------------
  - id: moza-actueel
    naam: "MijnOverheid Zakelijk – Actueel"
    categorie: nl-moza
    type: feed
    url: https://mijnoverheidzakelijk.nl/actueel/index.xml
    volledige_tekst: true
    filter: true
    prioriteit: 1
    site: https://mijnoverheidzakelijk.nl/actueel/
    toelichting: >-
      Nieuws van het programma MijnOverheid Zakelijk zelf. Alleen berichten waarin wallets,
      eIDAS of de EBW voorkomen, komen in de nieuwsbrief; de betreffende zinnen worden getoond.

  - id: moza-weekly
    naam: "MijnOverheid Zakelijk – MOZa Weekly"
    categorie: nl-moza
    type: feed
    url: https://mijnoverheidzakelijk.nl/weekly/index.xml
    volledige_tekst: true
    filter: true
    prioriteit: 1
    site: https://mijnoverheidzakelijk.nl/weekly/
