name: Bron onderzoeken

# Handmatig te starten via Actions > "Bron onderzoeken" > Run workflow.
# Handig om een nieuwe website te bekijken voordat je hem in config/bronnen.yaml zet:
# de uitkomst (feeds, nieuwslinks en een CSS-pad per link) staat in de samenvatting van de run.
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Een of meer URL's, gescheiden door spaties"
        required: true
      raad_feeds:
        description: "Ook gangbare feed-adressen proberen (/feed/, /rss.xml, ...)"
        type: boolean
        default: true
      als_browser:
        description: "Doen alsof het verzoek van een gewone browser komt"
        type: boolean
        default: false
      link_patroon:
        description: "Optioneel: toon alle links die passen bij dit link_patroon (bijv. /news/[^/]+/)"
        required: false
        default: ""
      tekst:
        description: "Optioneel: toon waar deze tekst op de pagina staat, met de HTML eromheen (bijv. een datum)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  onderzoek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: URL's onderzoeken
        env:
          URLS: ${{ inputs.urls }}
          GUESS: ${{ inputs.raad_feeds && '--guess-feeds' || '' }}
          BROWSER: ${{ inputs.als_browser && '--browser' || '' }}
          PATROON: ${{ inputs.link_patroon }}
          TEKST: ${{ inputs.tekst }}
        run: python tools/probe.py $GUESS $BROWSER ${PATROON:+--patroon "$PATROON"} ${TEKST:+--tekst "$TEKST"} "$URLS"
