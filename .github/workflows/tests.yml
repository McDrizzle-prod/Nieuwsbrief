name: Tests

on:
  push:
    paths:
      - "scraper/**"
      - "tests/**"
      - "config/**"
      - "requirements*.txt"
      - ".github/workflows/tests.yml"
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
