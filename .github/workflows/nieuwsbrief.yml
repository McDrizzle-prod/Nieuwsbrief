name: Nieuwsbrief bijwerken

# Haalt dagelijks alle bronnen op, slaat nieuwe berichten op in site/data en
# publiceert de nieuwsbrief op GitHub Pages. Handmatig starten kan via
# Actions > "Nieuwsbrief bijwerken" > Run workflow.
on:
  schedule:
    - cron: "23 4 * * *"   # elke dag om 04:23 UTC (06:23 zomertijd, 05:23 wintertijd)
  workflow_dispatch:
    inputs:
      bron:
        description: "Alleen deze bron-id's (gescheiden door spaties). Leeg = alle bronnen."
        required: false
        default: ""
  push:
    paths:
      - "config/**"
      - "scraper/**"
      - "site/**"
      - "!site/data/**"
      - "requirements.txt"
      - ".github/workflows/nieuwsbrief.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nieuwsbrief-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bijwerken:
    # Bij een push alleen draaien op de hoofdbranch (de standaardbranch van de repository).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bronnen ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          BRON: ${{ inputs.bron }}
        run: |
          args=()
          for b in $BRON; do args+=(--bron "$b"); done
          python -m scraper "${args[@]}"
      - name: Nieuwe berichten opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git commit -q -m "Nieuwsbrief bijgewerkt ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
          done
          exit 1
      - name: Pages voorbereiden
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  publiceren:
    needs: bijwerken
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
