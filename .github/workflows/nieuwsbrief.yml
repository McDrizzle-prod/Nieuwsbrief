name: Nieuwsbrief bijwerken

# Haalt dagelijks alle bronnen op, slaat nieuwe berichten op in site/data en
# publiceert de nieuwsbrief op GitHub Pages. Op vrijdag maakt de workflow daarna ook het
# weekoverzicht per mail aan (via Laposta, zie LAPOSTA.md). Handmatig starten kan via
# Actions > "Nieuwsbrief bijwerken" > Run workflow.
on:
  schedule:
    - cron: "23 4 * * *"   # elke dag om 04:23 UTC (06:23 zomertijd, 05:23 wintertijd)
    # Vrijdag: weekoverzicht aanmaken en in Laposta inplannen voor 16:00 Nederlandse tijd.
    # De tweede run is een reserve voor als GitHub de eerste overslaat.
    - cron: "40 12 * * 5"
    - cron: "40 13 * * 5"
  workflow_dispatch:
    inputs:
      bron:
        description: "Alleen deze bron-id's (gescheiden door spaties). Leeg = alle bronnen."
        required: false
        default: ""
      weekoverzicht:
        description: "Weekoverzicht per mail: 'test' stuurt een testmail naar het testadres; 'versturen' verstuurt nu naar alle abonnees."
        type: choice
        options: ["nee", "test", "versturen"]
        default: "nee"
      testadres:
        description: "E-mailadres voor de testmail"
        required: false
        default: ""
      forceer:
        description: "Ook versturen als het weekoverzicht van deze week al is verstuurd"
        type: boolean
        default: false
  push:
    paths:
      - "config/**"
      - "scraper/**"
      - "site/**"
      - "!site/data/**"
      - "requirements.txt"
      - ".github/workflows/nieuwsbrief.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nieuwsbrief-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  bijwerken:
    # Bij een push alleen draaien op de hoofdbranch (de standaardbranch van de repository).
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bronnen ophalen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MAX_BERICHTEN: ${{ vars.AI_MAX_BERICHTEN || '40' }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          GITHUB_TOKEN: ${{ github.token }}
          BRON: ${{ inputs.bron }}
        run: |
          args=()
          for b in $BRON; do args+=(--bron "$b"); done
          python -m scraper "${args[@]}"
      - name: Nieuwe berichten opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data data
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git commit -q -m "Nieuwsbrief bijgewerkt ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
          done
          exit 1
      - name: Pages voorbereiden
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v5
      - name: Melden dat GitHub Pages nog uit staat
        if: steps.pages.outcome != 'success'
        run: |
          echo "::warning title=GitHub Pages staat uit::De berichten zijn bijgewerkt, maar de site is niet gepubliceerd. Zet Pages aan via Settings > Pages > Source: GitHub Actions."
          {
            echo "### Let op: GitHub Pages staat nog uit"
            echo "De berichten zijn bijgewerkt en opgeslagen, maar de nieuwsbrief is niet gepubliceerd."
            echo "Ga naar **Settings → Pages**, kies bij *Source* **GitHub Actions** en start deze workflow opnieuw."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outcome == 'success'
        with:
          path: site
    outputs:
      pages: ${{ steps.pages.outcome }}

  publiceren:
    needs: bijwerken
    if: >-
      needs.bijwerken.outputs.pages == 'success' &&
      (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  weekoverzicht:
    needs: [bijwerken, publiceren]
    # Na de vrijdagse runs, of handmatig met de keuze 'test' of 'versturen'. Draait ook
    # als publiceren is overgeslagen (bijvoorbeeld omdat Pages uit staat).
    if: >-
      !cancelled() && needs.bijwerken.result == 'success' &&
      ((github.event_name == 'schedule' && github.event.schedule != '23 4 * * *') ||
       (github.event_name == 'workflow_dispatch' && inputs.weekoverzicht != 'nee'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Weekoverzicht aanmaken in Laposta
        env:
          LAPOSTA_API_KEY: ${{ secrets.LAPOSTA_API_KEY }}
          MODUS: ${{ github.event_name == 'schedule' && 'gepland' || inputs.weekoverzicht }}
          TESTADRES: ${{ inputs.testadres }}
          FORCEER: ${{ inputs.forceer }}
        run: |
          args=(--modus "$MODUS")
          if [ "$MODUS" = "test" ]; then args+=(--testadres "$TESTADRES"); fi
          if [ "$FORCEER" = "true" ]; then args+=(--forceer); fi
          python -m scraper.weekmail "${args[@]}"
      - name: Verzendstatus opslaan in de repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
            exit 0
          fi
          git commit -q -m "Status weekoverzicht bijgewerkt ($(date -u +%Y-%m-%d))"
          for attempt in 1 2 3; do
            git push && exit 0
            git pull --rebase -q origin "${GITHUB_REF_NAME}"
          done
          exit 1
